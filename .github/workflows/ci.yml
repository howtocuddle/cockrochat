name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: mesh-core

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh-core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: build cdylib + generate bindings (proves the FFI path)
        run: |
          cargo build --release
          cargo run --quiet --bin uniffi-bindgen -- generate \
            --library target/release/libmesh_core.so --language kotlin \
            --out-dir bindings/kotlin --no-format
          cargo run --quiet --bin uniffi-bindgen -- generate \
            --library target/release/libmesh_core.so --language swift \
            --out-dir bindings/swift --no-format

  fuzz-smoke:
    name: fuzz decode (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh-core
      - run: cargo install cargo-fuzz --locked
      - name: fuzz decode for 60s (0 panics / 0 allocs required)
        run: cargo +nightly fuzz run decode -- -max_total_time=60 -rss_limit_mb=2048
