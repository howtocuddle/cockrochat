[package]
name = "mesh-core"
version = "0.1.0"
edition = "2024"
description = "Shared security-critical core for the offline protest mesh (codec/crypto/pocp/beacon/trust)"
license = "AGPL-3.0-or-later"

# lib: unit tests + cargo-fuzz. cdylib: Android (.so) via UniFFI. staticlib: iOS static link.
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
arrayref = "=0.3.9"
blake3 = "=1.8.5"
chacha20poly1305 = "=0.11.0"
ed25519-dalek = "=3.0.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
getrandom = "0.3"
uniffi = { version = "=0.32.0", features = ["cli"] }
hex = "0.4"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

# uniffi-bindgen binary (library mode): generates Kotlin + Swift from the built cdylib.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[build-dependencies]
uniffi = { version = "=0.32.0", features = ["build"] }

[dev-dependencies]
hex = "0.4"
proptest = "=1.11.0"

# Fuzzing (cargo-fuzz) and any perf bench want release-like opts even on the parse path.
[profile.release]
panic = "abort"
